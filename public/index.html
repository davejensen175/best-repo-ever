<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Property Walkthrough</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>AI Property Walkthrough</h1>
    <p>Upload photos room by room and get a guided walkthrough with a condition report.</p>
  </header>

  <main>
    <form id="walkthrough-form" class="card">
      <h2>Property</h2>
      <div class="grid">
        <label>Address <input name="address" placeholder="123 Main St, Springfield"></label>
        <label>Property type
          <select name="type">
            <option value="">Not specified</option>
            <option>House</option>
            <option>Apartment / condo</option>
            <option>Townhouse</option>
            <option>Commercial</option>
          </select>
        </label>
        <label>Walkthrough is for
          <select name="audience">
            <option>Prospective buyer</option>
            <option>Prospective renter</option>
            <option>Landlord move-in / move-out</option>
            <option>Seller preparing to list</option>
          </select>
        </label>
      </div>
      <label>Notes <textarea name="notes" rows="2" placeholder="Anything the AI should know (age of the building, known repairs, ...)"></textarea></label>

      <h2>Rooms</h2>
      <ol id="rooms" class="rooms"></ol>
      <button type="button" id="add-room" class="secondary">+ Add room</button>

      <div class="actions">
        <button type="submit" id="generate">Generate walkthrough</button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </form>

    <section id="report" class="card" hidden></section>
  </main>

  <template id="room-template">
    <li class="room">
      <div class="room-head">
        <input class="room-name" placeholder="Room name (e.g. Kitchen)" required>
        <button type="button" class="remove-room link" aria-label="Remove room">Remove</button>
      </div>
      <input class="room-notes" placeholder="Optional notes for this room">
      <label class="dropzone">
        <input type="file" class="room-files" accept="image/*" multiple>
        <span>Choose or drop up to 6 photos</span>
      </label>
      <div class="thumbs"></div>
    </li>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
